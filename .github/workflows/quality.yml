name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  production-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install quality tools
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find wp-content scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WordPress coding standards
        run: composer phpcs
      - name: Create CI-only seed media
        run: |
          mkdir -p seed-media
          pixel=''
          for name in noir-asymmetric-top noir-asymmetric-top-detail cobalt-asymmetric-top cobalt-asymmetric-top-detail noir-one-piece noir-one-piece-detail azur-bikini-bottom azur-bikini-bottom-detail azur-bralet-top azur-bralet-top-detail cobalt-set hero-aegean-black hero-aegean-black-mobile; do
            printf '%s' "$pixel" | base64 --decode > "seed-media/$name.jpg"
          done
      - name: Install clean production stack
        run: make install
      - name: Acceptance and smoke tests
        run: make verify
