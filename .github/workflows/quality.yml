name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install quality tools
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find wp-content scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WordPress coding standards
        run: composer phpcs
      - name: Create CI-only seed media
        run: |
          mkdir -p seed-media
          pixel=''
          for name in \
            noir-asymmetric-top noir-asymmetric-top-detail \
            cobalt-asymmetric-top cobalt-asymmetric-top-detail \
            noir-one-piece noir-one-piece-detail \
            azur-bikini-bottom azur-bikini-bottom-detail \
            azur-bralet-top azur-bralet-top-detail \
            cobalt-set hero-aegean-black hero-aegean-black-mobile \
            story-01-desktop story-01-mobile \
            story-02-desktop story-02-mobile \
            story-03-desktop story-03-mobile \
            story-04-desktop story-04-mobile \
            story-05-desktop story-05-mobile \
            story-06-desktop story-06-mobile; do
            printf '%s' "$pixel" | base64 --decode > "seed-media/$name.jpg"
          done
      - name: Install clean production stack
        run: make install
      - name: Acceptance and smoke tests
        run: make verify
