services:
  db:
    image: mariadb:11.4@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kukaisland-wordpress:php8.3-soap
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      KUKA_SMTP_HOST: ${KUKA_SMTP_HOST:-}
      KUKA_SMTP_PORT: ${KUKA_SMTP_PORT:-}
      KUKA_SMTP_USERNAME: ${KUKA_SMTP_USERNAME:-}
      KUKA_SMTP_PASSWORD: ${KUKA_SMTP_PASSWORD:-}
      KUKA_SMTP_ENCRYPTION: ${KUKA_SMTP_ENCRYPTION:-}
      KUKA_SMTP_FROM_NAME: ${KUKA_SMTP_FROM_NAME:-}
      KUKA_SMTP_REPLY_TO_EMAIL: ${KUKA_SMTP_REPLY_TO_EMAIL:-}
      KUKA_SMTP_REPLY_TO_NAME: ${KUKA_SMTP_REPLY_TO_NAME:-}
      WORDPRESS_DEBUG: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', false );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
        defined( 'KUKA_SMTP_HOST' ) || define( 'KUKA_SMTP_HOST', getenv( 'KUKA_SMTP_HOST' ) ?: '' );
        defined( 'KUKA_SMTP_PORT' ) || define( 'KUKA_SMTP_PORT', (int) ( getenv( 'KUKA_SMTP_PORT' ) ?: 0 ) );
        defined( 'KUKA_SMTP_USERNAME' ) || define( 'KUKA_SMTP_USERNAME', getenv( 'KUKA_SMTP_USERNAME' ) ?: '' );
        defined( 'KUKA_SMTP_PASSWORD' ) || define( 'KUKA_SMTP_PASSWORD', getenv( 'KUKA_SMTP_PASSWORD' ) ?: '' );
        defined( 'KUKA_SMTP_ENCRYPTION' ) || define( 'KUKA_SMTP_ENCRYPTION', getenv( 'KUKA_SMTP_ENCRYPTION' ) ?: '' );
        defined( 'KUKA_SMTP_FROM_NAME' ) || define( 'KUKA_SMTP_FROM_NAME', getenv( 'KUKA_SMTP_FROM_NAME' ) ?: '' );
        defined( 'KUKA_SMTP_REPLY_TO_EMAIL' ) || define( 'KUKA_SMTP_REPLY_TO_EMAIL', getenv( 'KUKA_SMTP_REPLY_TO_EMAIL' ) ?: '' );
        defined( 'KUKA_SMTP_REPLY_TO_NAME' ) || define( 'KUKA_SMTP_REPLY_TO_NAME', getenv( 'KUKA_SMTP_REPLY_TO_NAME' ) ?: '' );
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/kuka-island-child:/var/www/html/wp-content/themes/kuka-island-child
      - ./wp-content/plugins/kuka-island-core:/var/www/html/wp-content/plugins/kuka-island-core
      - ./wp-content/plugins/kuka-island-edm:/var/www/html/wp-content/plugins/kuka-island-edm
      - ./wp-content/plugins/kuka-island-shipping-automation:/var/www/html/wp-content/plugins/kuka-island-shipping-automation
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-kuka-opcache.ini:ro
      - ./docker/apache/assets-cache.conf:/etc/apache2/conf-enabled/zz-kuka-assets-cache.conf:ro
      - ./seed-media:/seed-media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  wp-cli:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kukaisland-wordpress:php8.3-soap
    entrypoint: []
    cpus: 1.0
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      KUKA_SMTP_HOST: ${KUKA_SMTP_HOST:-}
      KUKA_SMTP_PORT: ${KUKA_SMTP_PORT:-}
      KUKA_SMTP_USERNAME: ${KUKA_SMTP_USERNAME:-}
      KUKA_SMTP_PASSWORD: ${KUKA_SMTP_PASSWORD:-}
      KUKA_SMTP_ENCRYPTION: ${KUKA_SMTP_ENCRYPTION:-}
      KUKA_SMTP_FROM_NAME: ${KUKA_SMTP_FROM_NAME:-}
      KUKA_SMTP_REPLY_TO_EMAIL: ${KUKA_SMTP_REPLY_TO_EMAIL:-}
      KUKA_SMTP_REPLY_TO_NAME: ${KUKA_SMTP_REPLY_TO_NAME:-}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'DISABLE_WP_CRON', true );
        defined( 'KUKA_SMTP_HOST' ) || define( 'KUKA_SMTP_HOST', getenv( 'KUKA_SMTP_HOST' ) ?: '' );
        defined( 'KUKA_SMTP_PORT' ) || define( 'KUKA_SMTP_PORT', (int) ( getenv( 'KUKA_SMTP_PORT' ) ?: 0 ) );
        defined( 'KUKA_SMTP_USERNAME' ) || define( 'KUKA_SMTP_USERNAME', getenv( 'KUKA_SMTP_USERNAME' ) ?: '' );
        defined( 'KUKA_SMTP_PASSWORD' ) || define( 'KUKA_SMTP_PASSWORD', getenv( 'KUKA_SMTP_PASSWORD' ) ?: '' );
        defined( 'KUKA_SMTP_ENCRYPTION' ) || define( 'KUKA_SMTP_ENCRYPTION', getenv( 'KUKA_SMTP_ENCRYPTION' ) ?: '' );
        defined( 'KUKA_SMTP_FROM_NAME' ) || define( 'KUKA_SMTP_FROM_NAME', getenv( 'KUKA_SMTP_FROM_NAME' ) ?: '' );
        defined( 'KUKA_SMTP_REPLY_TO_EMAIL' ) || define( 'KUKA_SMTP_REPLY_TO_EMAIL', getenv( 'KUKA_SMTP_REPLY_TO_EMAIL' ) ?: '' );
        defined( 'KUKA_SMTP_REPLY_TO_NAME' ) || define( 'KUKA_SMTP_REPLY_TO_NAME', getenv( 'KUKA_SMTP_REPLY_TO_NAME' ) ?: '' );
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/kuka-island-child:/var/www/html/wp-content/themes/kuka-island-child
      - ./wp-content/plugins/kuka-island-core:/var/www/html/wp-content/plugins/kuka-island-core
      - ./wp-content/plugins/kuka-island-edm:/var/www/html/wp-content/plugins/kuka-island-edm
      - ./wp-content/plugins/kuka-island-shipping-automation:/var/www/html/wp-content/plugins/kuka-island-shipping-automation
      - ./scripts:/project-scripts:ro
      - ./seed-media:/seed-media:ro
    working_dir: /var/www/html

  wp-cron:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kukaisland-wordpress:php8.3-soap
    restart: unless-stopped
    entrypoint: []
    cpus: 0.5
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      KUKA_SMTP_HOST: ${KUKA_SMTP_HOST:-}
      KUKA_SMTP_PORT: ${KUKA_SMTP_PORT:-}
      KUKA_SMTP_USERNAME: ${KUKA_SMTP_USERNAME:-}
      KUKA_SMTP_PASSWORD: ${KUKA_SMTP_PASSWORD:-}
      KUKA_SMTP_ENCRYPTION: ${KUKA_SMTP_ENCRYPTION:-}
      KUKA_SMTP_FROM_NAME: ${KUKA_SMTP_FROM_NAME:-}
      KUKA_SMTP_REPLY_TO_EMAIL: ${KUKA_SMTP_REPLY_TO_EMAIL:-}
      KUKA_SMTP_REPLY_TO_NAME: ${KUKA_SMTP_REPLY_TO_NAME:-}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'DISABLE_WP_CRON', true );
        defined( 'KUKA_SMTP_HOST' ) || define( 'KUKA_SMTP_HOST', getenv( 'KUKA_SMTP_HOST' ) ?: '' );
        defined( 'KUKA_SMTP_PORT' ) || define( 'KUKA_SMTP_PORT', (int) ( getenv( 'KUKA_SMTP_PORT' ) ?: 0 ) );
        defined( 'KUKA_SMTP_USERNAME' ) || define( 'KUKA_SMTP_USERNAME', getenv( 'KUKA_SMTP_USERNAME' ) ?: '' );
        defined( 'KUKA_SMTP_PASSWORD' ) || define( 'KUKA_SMTP_PASSWORD', getenv( 'KUKA_SMTP_PASSWORD' ) ?: '' );
        defined( 'KUKA_SMTP_ENCRYPTION' ) || define( 'KUKA_SMTP_ENCRYPTION', getenv( 'KUKA_SMTP_ENCRYPTION' ) ?: '' );
        defined( 'KUKA_SMTP_FROM_NAME' ) || define( 'KUKA_SMTP_FROM_NAME', getenv( 'KUKA_SMTP_FROM_NAME' ) ?: '' );
        defined( 'KUKA_SMTP_REPLY_TO_EMAIL' ) || define( 'KUKA_SMTP_REPLY_TO_EMAIL', getenv( 'KUKA_SMTP_REPLY_TO_EMAIL' ) ?: '' );
        defined( 'KUKA_SMTP_REPLY_TO_NAME' ) || define( 'KUKA_SMTP_REPLY_TO_NAME', getenv( 'KUKA_SMTP_REPLY_TO_NAME' ) ?: '' );
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/kuka-island-child:/var/www/html/wp-content/themes/kuka-island-child
      - ./wp-content/plugins/kuka-island-core:/var/www/html/wp-content/plugins/kuka-island-core
      - ./wp-content/plugins/kuka-island-edm:/var/www/html/wp-content/plugins/kuka-island-edm
      - ./wp-content/plugins/kuka-island-shipping-automation:/var/www/html/wp-content/plugins/kuka-island-shipping-automation
    working_dir: /var/www/html
    command:
      - sh
      - -c
      - |
        trap 'exit 0' TERM INT
        while true; do
          wp cron event run --due-now --quiet || true
          sleep 60 & wait $${!}
        done
    healthcheck:
      test: ["CMD-SHELL", "wp core is-installed >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  wordpress_data:
