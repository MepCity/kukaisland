services:
  db:
    image: mariadb:11.4@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache@sha256:7f1f307f9b651246d4084ff8978ecf4515ebcc9106c62e2fa364c76f8ab7ee56
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', false );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/kuka-island-child:/var/www/html/wp-content/themes/kuka-island-child
      - ./wp-content/plugins/kuka-island-core:/var/www/html/wp-content/plugins/kuka-island-core
      - ./seed-media:/seed-media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  wp-cli:
    image: wordpress:cli-php8.3@sha256:2b5e9d4d3e51909dca1aaa4732e9f5e5bf0377c2114dbd8ff39f060bff202586
    # İmajın entrypoint'i "wp help <ilk-argüman>" çalıştırıp başarılıysa komutun
    # başına bir "wp" daha ekliyor. İlk argümanımız zaten "wp" olduğu için bu
    # tahmin, eklenti sayısına göre bazen tutup komutu "wp wp ..." yapıyor ve
    # kurulum "'wp' is not a registered wp command" ile düşüyordu. Entrypoint
    # kaldırılınca komut ne yazıldıysa o çalışır.
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/kuka-island-child:/var/www/html/wp-content/themes/kuka-island-child
      - ./wp-content/plugins/kuka-island-core:/var/www/html/wp-content/plugins/kuka-island-core
      - ./scripts:/project-scripts:ro
      - ./seed-media:/seed-media:ro
    working_dir: /var/www/html

volumes:
  db_data:
  wordpress_data:
